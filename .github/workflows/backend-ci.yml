name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/bootstrap-dotnet-api]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-integration-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BackendLoyalty.sln

      - name: Build
        run: dotnet build BackendLoyalty.sln --configuration Release --no-restore

      - name: PostgreSQL integration tests
        env:
          LOYALTY_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=disposable-integration-tests-only"
        run: dotnet test BackendLoyalty.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Docker build
        run: docker build -t backend-loyalty:ci .
