services:
  db:
    image: postgres:17
    container_name: loyalty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOYALTY_DB_ADMIN_PASSWORD:?LOYALTY_DB_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - loyalty-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - loyalty-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend-loyalty:vps
    container_name: backend-loyalty
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LoyaltyDb: Host=loyalty-postgres;Port=5432;Database=loyalty;Username=loyalty_app;Password=${LOYALTY_DB_PASSWORD:?LOYALTY_DB_PASSWORD is required}
      Jwt__Issuer: ${Jwt__Issuer:-backend-loyalty}
      Jwt__Audience: ${Jwt__Audience:-loyalty-app}
      Jwt__SigningKey: ${Jwt__SigningKey:?Jwt__SigningKey is required}
      Jwt__AccessTokenMinutes: ${Jwt__AccessTokenMinutes:-15}
      Jwt__RefreshTokenDays: ${Jwt__RefreshTokenDays:-7}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
    ports:
      - "127.0.0.1:${LOYALTY_API_PORT:-5092}:8080"
    networks:
      - loyalty-internal

networks:
  loyalty-internal:
    name: loyalty-internal

volumes:
  loyalty-postgres-data:
    name: loyalty-postgres-data
