services:
  waha:
    image: devlikeapro/waha:gows
    container_name: loyalty-waha
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    pids_limit: 128
    environment:
      WAHA_API_KEY: ${WAHA_SERVER_API_KEY:?WAHA_SERVER_API_KEY is required}
      WAHA_HEALTHCHECK_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY is required}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WHATSAPP_DEFAULT_ENGINE: "GOWS"
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: "info"
    volumes:
      - loyalty-waha-sessions:/app/.sessions
    ports:
      - "127.0.0.1:${WAHA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"X-Api-Key: ${WAHA_HEALTHCHECK_API_KEY}\" http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - loyalty-internal

networks:
  loyalty-internal:
    external: true
    name: loyalty-internal

volumes:
  loyalty-waha-sessions:
    name: loyalty-waha-sessions
